<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="90" y1="60" x2="430" y2="465" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFDCE9"/>
      <stop offset="0.55" stop-color="#FFBFD8"/>
      <stop offset="1" stop-color="#FF9CC1"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="270" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="190" y1="130" x2="330" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB25C"/>
      <stop offset="0.55" stop-color="#FF9331"/>
      <stop offset="1" stop-color="#F9701A"/>
    </linearGradient>
    <filter id="catShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.16"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景：圆角方形，粉色渐变 -->
  <rect x="32" y="32" width="448" height="448" rx="120" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="120" fill="url(#glow)"/>

  <!-- 主体：橙色小猫 -->
  <g filter="url(#catShadow)">
    <!-- 耳朵 -->
    <path d="M146 224 L137.8 134.9 C136.3 118.5 146.9 111.3 161.5 119 L258 170 Z" fill="url(#fur)"/>
    <path d="M366 224 L374.2 134.9 C375.7 118.5 365.1 111.3 350.5 119 L254 170 Z" fill="url(#fur)"/>

    <!-- 头 -->
    <ellipse cx="256" cy="294" rx="139" ry="129" fill="url(#fur)"/>

    <!-- 内耳 -->
    <path d="M168 214 L156 141.8 C154.4 132 159.9 128.1 168.4 133.2 L240 176 Z" fill="#FF7FA8" fill-opacity="0.9"/>
    <path d="M344 214 L356 141.8 C357.6 132 352.1 128.1 343.6 133.2 L272 176 Z" fill="#FF7FA8" fill-opacity="0.9"/>
  </g>

  <!-- 脸 -->
  <ellipse cx="212" cy="286" rx="15" ry="20" fill="#4A2416"/>
  <ellipse cx="300" cy="286" rx="15" ry="20" fill="#4A2416"/>
  <circle cx="207" cy="279" r="5" fill="#FFFFFF" fill-opacity="0.92"/>
  <circle cx="295" cy="279" r="5" fill="#FFFFFF" fill-opacity="0.92"/>

  <ellipse cx="186" cy="330" rx="21" ry="11" fill="#FF5C87" fill-opacity="0.22"/>
  <ellipse cx="326" cy="330" rx="21" ry="11" fill="#FF5C87" fill-opacity="0.22"/>

  <!-- 鼻子 -->
  <path d="M243 314 Q256 309 269 314 Q263 330 256 331 Q249 330 243 314 Z" fill="#E0507B"/>
  <!-- 嘴 -->
  <path d="M256 331 L256 338" stroke="#E0507B" stroke-width="6" stroke-linecap="round"/>
  <path d="M256 338 Q246 348 236 338" stroke="#E0507B" stroke-width="6" stroke-linecap="round"/>
  <path d="M256 338 Q266 348 276 338" stroke="#E0507B" stroke-width="6" stroke-linecap="round"/>

  <!-- 胡须 -->
  <g stroke="#D9610F" stroke-width="7" stroke-linecap="round" stroke-opacity="0.5">
    <path d="M160 296 L104 282"/>
    <path d="M158 322 L100 322"/>
    <path d="M352 296 L408 282"/>
    <path d="M354 322 L412 322"/>
  </g>
</svg>
